<!DOCTYPE html>
<!-- generated by tools/build-landing-i18n.mjs — do not edit -->
<html lang="{{HTML_LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
{{ALTERNATE_LINKS}}
<meta property="og:type" content="website">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta property="og:url" content="{{OG_URL}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
{{OG_LOCALE_ALTERNATE}}
<meta name="twitter:card" content="{{TWITTER_CARD}}">
<meta name="twitter:title" content="{{TWITTER_TITLE}}">
<meta name="twitter:description" content="{{TWITTER_DESCRIPTION}}">
<meta name="twitter:image" content="{{TWITTER_IMAGE_URL}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
<style>
  :root {
    --parchment: #FAF3E0;
    --parchment-light: #F5EBD8;
    --ink: #3D2B1F;
    --leather: #5C4033;
    --faded-brown: #6D5D4D;
    --muted-brown: #795548;
    --gold: #D4AF37;
    --shadow: rgba(92, 64, 51, 0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--parchment) url('{{ASSET_PREFIX}}assets/paper_texture.webp');
    color: var(--ink);
    font-family: {{FONT_FAMILY}};
    line-height: 1.7;
  }
  a { color: var(--leather); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; max-width: 720px; margin: 0 auto;
  }
  .brand { font-weight: bold; letter-spacing: 1px; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .lang-switcher { display: flex; align-items: center; }
  .lang-switcher select {
    font-family: inherit; font-size: 0.85rem; color: var(--leather);
    background-color: var(--parchment-light);
    background-image: linear-gradient(45deg, transparent 50%, var(--faded-brown) 50%),
                      linear-gradient(135deg, var(--faded-brown) 50%, transparent 50%);
    background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    border: 1px solid var(--faded-brown); border-radius: 20px;
    padding: 5px 32px 5px 14px; cursor: pointer;
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    max-width: 60vw; text-overflow: ellipsis;
  }
  .lang-switcher select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .back-link {
    font-size: 0.85rem; text-decoration: none;
    border: 1px solid var(--faded-brown); border-radius: 20px; padding: 4px 14px;
  }

  .doc { padding: 24px 0 56px; }
  .doc h1 { font-size: 1.6rem; letter-spacing: 1px; margin-bottom: 8px; }
  .doc .updated { font-size: 0.85rem; color: var(--muted-brown); margin-bottom: 20px; }
  .doc .intro {
    background: var(--parchment-light); border: 1px solid rgba(92,64,51,0.2);
    border-left: 3px solid var(--gold); border-radius: 6px;
    padding: 16px 18px; margin-bottom: 32px; font-size: 0.95rem;
  }
  .doc section { padding: 0; margin-bottom: 28px; }
  .doc h2 {
    font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid rgba(92,64,51,0.2);
  }
  .doc p { font-size: 0.93rem; margin-bottom: 10px; }
  .doc ul { margin: 0 0 10px 22px; }
  .doc li { font-size: 0.93rem; margin-bottom: 6px; }

  footer { text-align: center; padding: 24px 20px; font-size: 0.8rem; color: var(--faded-brown); }
</style>
</head>
<body>

<header>
  <span class="brand">{{HEADER_BRAND}}</span>
  {{LANGUAGE_SWITCHER}}
  <a class="back-link" href="{{HOME_HREF}}">{{BACK_LABEL}}</a>
</header>

<main class="doc wrap">
  <h1>{{PRIVACY_TITLE}}</h1>
  <p class="updated">{{LAST_UPDATED_LABEL}}: {{LAST_UPDATED}}</p>
  <p class="intro">{{PRIVACY_INTRO}}</p>
{{SECTIONS_HTML}}
</main>

<footer>
  {{FOOTER_HTML}}
</footer>

<script>
document.querySelectorAll('[data-lang-switcher]').forEach(function (select) {
  select.addEventListener('change', function () {
    if (this.value) window.location.href = this.value;
  });
});
</script>
</body>
</html>
